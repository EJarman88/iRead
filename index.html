<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Reader</title>
<style>
  :root {
    --deep-space: #0b1024;
    --panel: #131a35;
    --star: #ffe9a8;
    --nebula: #7c8cff;
    --nebula-soft: #3d4a8f;
    --success: #6bdc9c;
    --text: #eef0ff;
    --text-dim: #a8afd6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at top, #1a2150 0%, var(--deep-space) 60%);
    font-family: 'Baloo 2', 'Comic Sans MS', system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  #stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }
  .star {
    position: absolute; background: var(--star); border-radius: 50%;
    opacity: 0.6; animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: .9; } }

  main {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; padding: 24px; text-align: center;
  }

  .mascot {
    font-size: 64px; margin-bottom: 8px;
    filter: drop-shadow(0 0 12px rgba(124,140,255,0.6));
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }

  h1 {
    font-size: 32px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 18px;
    margin: 0 0 32px;
  }

  .drill-picker {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: 100%;
    max-width: 340px;
  }

  .drill-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--panel);
    border: 2px solid var(--nebula-soft);
    border-radius: 20px;
    padding: 20px 26px;
    color: var(--text);
    text-decoration: none;
    font-size: 22px;
    font-weight: 700;
    box-shadow: 0 0 30px rgba(124,140,255,0.15), inset 0 0 40px rgba(124,140,255,0.04);
    transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .drill-btn:active {
    transform: scale(0.97);
  }
  .drill-btn:hover {
    border-color: var(--nebula);
    box-shadow: 0 0 40px rgba(124,140,255,0.3), inset 0 0 40px rgba(124,140,255,0.06);
  }
  .drill-btn .icon { font-size: 34px; }
  .drill-btn .label { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .drill-btn .label small { font-size: 13px; font-weight: 400; color: var(--text-dim); }
</style>
</head>
<body>
<div id="stars"></div>
<main>
  <div class="mascot">🚀</div>
  <h1>Star Reader</h1>
  <p class="subtitle">Pick a drill, astronaut!</p>
  <nav class="drill-picker">
    <a class="drill-btn" href="./reading.html">
      <span class="icon">🔊</span>
      <span class="label">Reading<small>Say the word</small></span>
    </a>
    <a class="drill-btn" href="./spelling.html">
      <span class="icon">✏️</span>
      <span class="label">Spelling<small>Hear it, type it</small></span>
    </a>
    <a class="drill-btn" href="./word-helper.html">
      <span class="icon">📷</span>
      <span class="label">Word Helper<small>Snap a stuck word</small></span>
    </a>
    <a class="drill-btn" href="./passage.html">
      <span class="icon">📖</span>
      <span class="label">Passage Reading<small>Read it out loud</small></span>
    </a>
    <a class="drill-btn" href="./apex-armada.html">
      <span class="icon">🦖⚓</span>
      <span class="label">Apex Armada<small>Dino battle spelling</small></span>
    </a>
  </nav>
</main>

<script>
(function makeStars() {
  const field = document.getElementById("stars");
  for (let i = 0; i < 60; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = Math.random() * 2 + 1;
    s.style.width = s.style.height = size + "px";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = (Math.random() * 3) + "s";
    field.appendChild(s);
  }
})();
</script>
</body>
</html>
